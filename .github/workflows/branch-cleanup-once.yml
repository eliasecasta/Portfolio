name: One-time cleanup of merged portfolio branches

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/branch-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'eliasecasta/Portfolio'
    runs-on: ubuntu-latest
    steps:
      - name: Remove only three verified merged branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          remove_if_merged() {
            local branch="$1" expected_sha="$2" pr="$3"
            local merged_at head_ref actual_sha open_count
            merged_at="$(gh api "repos/$REPO/pulls/$pr" --jq '.merged_at')"
            head_ref="$(gh api "repos/$REPO/pulls/$pr" --jq '.head.ref')"
            if [[ "$merged_at" == "null" || "$head_ref" != "$branch" ]]; then
              echo "PR #$pr not verified as merged from $branch"; exit 1
            fi
            actual_sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "Branch $branch changed; refusing to delete"; exit 1
            fi
            open_count="$(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq "[.[] | select(.head.ref == \"$branch\" and .head.repo.full_name == \"$REPO\")] | length")"
            if [[ "$open_count" != "0" ]]; then
              echo "Branch $branch has an open PR; refusing to delete"; exit 1
            fi
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            echo "Deleted merged branch $branch"
          }
          remove_if_merged 'feature/public-minibooker-code-sample' '5e142a3aa1c7fd2e1452b376a75388e4fb05af30' '3'
          remove_if_merged 'fix/restore-neon-theme-update-copy-2026' '906bf6a9f9d8fb23659fe4a82454d719cbc1a444' '2'
          remove_if_merged 'rebrand/ai-native-product-engineer-2026' '2ec6fb3d8c1283a9784db61ffe6c87e031d25bde' '1'
